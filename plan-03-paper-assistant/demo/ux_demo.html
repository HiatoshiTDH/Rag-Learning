<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Assistant — UX Demo</title>
<style>
  :root {
    --bg:#F7F8F6; --panel:#FFFFFF; --panel-2:#EFF2EF; --border:#DCE1DD;
    --ink:#1C2321; --muted:#5F6E67; --accent:#0F6B5C; --accent-ink:#FFFFFF;
    --user-bubble:#E7EFEB; --ok:#1B7F4C; --warn:#9A6B00; --err:#B3382E;
    --shadow:0 1px 3px rgba(28,35,33,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#141917; --panel:#1C2320; --panel-2:#232B27; --border:#2C3531;
      --ink:#E8ECE9; --muted:#8FA098; --accent:#4FB89F; --accent-ink:#0C1512;
      --user-bubble:#22332D; --ok:#5BBF87; --warn:#D9A72E; --err:#E07B72;
      --shadow:0 1px 3px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg:#141917; --panel:#1C2320; --panel-2:#232B27; --border:#2C3531;
    --ink:#E8ECE9; --muted:#8FA098; --accent:#4FB89F; --accent-ink:#0C1512;
    --user-bubble:#22332D; --ok:#5BBF87; --warn:#D9A72E; --err:#E07B72;
    --shadow:0 1px 3px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg:#F7F8F6; --panel:#FFFFFF; --panel-2:#EFF2EF; --border:#DCE1DD;
    --ink:#1C2321; --muted:#5F6E67; --accent:#0F6B5C; --accent-ink:#FFFFFF;
    --user-bubble:#E7EFEB; --ok:#1B7F4C; --warn:#9A6B00; --err:#B3382E;
    --shadow:0 1px 3px rgba(28,35,33,.08);
  }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.55 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button { font:inherit; cursor:pointer; }
  input, select, textarea { font:inherit; color:var(--ink); }

  .topbar { display:flex; align-items:center; gap:14px; padding:10px 16px;
            border-bottom:1px solid var(--border); background:var(--panel); }
  .brand { font:600 17px/1 Charter, "Bitstream Charter", Cambria, Georgia, serif; }
  .brand small { display:block; font:11px/1.4 ui-sans-serif, sans-serif;
                 color:var(--muted); font-weight:400; margin-top:2px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-left:auto; }
  .chip { font-size:11.5px; padding:3px 9px; border-radius:999px;
          border:1px solid var(--border); color:var(--muted); background:var(--panel-2);
          white-space:nowrap; }
  .chip.ok { color:var(--ok); border-color:currentColor; }
  .chip.warn { color:var(--warn); border-color:currentColor; }
  #menu-btn { display:none; background:none; border:1px solid var(--border);
              border-radius:8px; padding:5px 10px; color:var(--ink); }

  .app { display:flex; height:calc(100vh - 57px); }

  /* ---------------- sidebar: thư viện paper ---------------- */
  .side { width:290px; flex:none; border-right:1px solid var(--border);
          background:var(--panel); display:flex; flex-direction:column; }
  .side h2 { font-size:11px; text-transform:uppercase; letter-spacing:.08em;
             color:var(--muted); margin:14px 14px 6px; font-weight:600; }
  .side .search { margin:0 14px 8px; }
  .search input { width:100%; padding:7px 10px; background:var(--bg);
                  border:1px solid var(--border); border-radius:8px; }
  .plist { flex:1; overflow-y:auto; padding:0 8px 8px; }
  .paper { display:flex; gap:8px; align-items:flex-start; padding:8px 6px;
           border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .paper:hover { background:var(--panel-2); }
  .paper.scoped { border-color:var(--accent); background:var(--panel-2); }
  .paper input { margin-top:3px; accent-color:var(--accent); }
  .paper .t { font-weight:500; }
  .paper .m { font-size:11.5px; color:var(--muted);
              font-variant-numeric:tabular-nums; }
  .side .controls { border-top:1px solid var(--border); padding:12px 14px;
                    display:flex; flex-direction:column; gap:9px; }
  .controls select { width:100%; padding:6px 9px; background:var(--bg);
                     border:1px solid var(--border); border-radius:8px; }
  .controls label { display:flex; gap:7px; align-items:center; color:var(--muted);
                    font-size:13px; }
  .controls input[type=checkbox] { accent-color:var(--accent); }
  #cmp-btn { width:100%; padding:8px; border-radius:8px; background:var(--panel-2);
             border:1px solid var(--border); color:var(--ink); }
  #cmp-btn:not(:disabled) { border-color:var(--accent); color:var(--accent); }
  #cmp-btn:disabled { opacity:.55; cursor:default; }
  #scope-note { font-size:12px; color:var(--accent); display:flex; gap:6px;
                align-items:center; }
  #scope-note button { background:none; border:none; color:var(--muted);
                       text-decoration:underline; padding:0; font-size:12px; }

  /* ---------------- khoang chat ---------------- */
  .chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  #conv { flex:1; overflow-y:auto; padding:20px 0; }
  .conv-inner { max-width:780px; margin:0 auto; padding:0 18px; }

  .empty { max-width:520px; margin:9vh auto 0; text-align:center; color:var(--muted); }
  .empty .glyph { font:400 40px/1 Charter, Georgia, serif; color:var(--accent); }
  .empty h3 { color:var(--ink); font-weight:600; margin:14px 0 6px; }
  .empty .ex { display:flex; flex-direction:column; gap:8px; margin-top:18px; }
  .empty .ex button { text-align:left; padding:9px 13px; border-radius:9px;
                      background:var(--panel); border:1px solid var(--border);
                      color:var(--ink); }
  .empty .ex button:hover { border-color:var(--accent); }

  .msg { margin-bottom:14px; }
  .msg.user { display:flex; justify-content:flex-end; }
  .msg.user .bubble { background:var(--user-bubble); border-radius:12px 12px 3px 12px;
                      padding:9px 13px; max-width:85%; white-space:pre-wrap; }
  .msg.bot .bubble { background:var(--panel); border:1px solid var(--border);
                     border-radius:3px 12px 12px 12px; padding:14px 16px;
                     box-shadow:var(--shadow); }
  .answer { font:15.5px/1.65 Charter, "Bitstream Charter", Cambria, Georgia, serif;
            white-space:pre-wrap; }
  .answer.streaming::after { content:"▍"; color:var(--accent);
                             animation:blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { .answer.streaming::after { animation:none; } }
  .cites { border-top:1px solid var(--border); margin-top:12px; padding-top:9px;
           font-size:12.5px; color:var(--muted); }
  .cites b { color:var(--ink); font-weight:600; }
  .usage { margin-top:7px; font:11.5px/1.4 ui-monospace, "SF Mono", Consolas, monospace;
           color:var(--muted); font-variant-numeric:tabular-nums; }
  .err { color:var(--err); }

  /* ---------------- composer ---------------- */
  .composer { border-top:1px solid var(--border); background:var(--panel);
              padding:12px 18px; }
  .composer-inner { max-width:780px; margin:0 auto; display:flex; gap:10px;
                    align-items:flex-end; }
  #q { flex:1; min-height:44px; max-height:160px; resize:none; padding:10px 13px;
       background:var(--bg); border:1px solid var(--border); border-radius:10px; }
  #q:focus, .search input:focus, select:focus, button:focus-visible {
    outline:2px solid var(--accent); outline-offset:1px; }
  #send { background:var(--accent); color:var(--accent-ink); border:none;
          border-radius:10px; padding:10px 20px; font-weight:600; }
  #send:disabled { opacity:.55; cursor:wait; }
  #new-conv { background:none; border:1px solid var(--border); border-radius:10px;
              padding:10px 12px; color:var(--muted); }
  .hint { max-width:780px; margin:6px auto 0; font-size:11.5px; color:var(--muted); }

  /* ---------------- mobile ---------------- */
  @media (max-width: 760px) {
    #menu-btn { display:block; }
    .side { position:fixed; inset:57px auto 0 0; z-index:20; width:82vw;
            max-width:320px; transform:translateX(-102%); transition:transform .2s; }
    @media (prefers-reduced-motion: reduce) { .side { transition:none; } }
    .side.open { transform:none; box-shadow:0 0 40px rgba(0,0,0,.3); }
    .chips .chip.optional { display:none; }
  }
</style>
</head>
<body>

<header class="topbar">
  <button id="menu-btn" aria-label="Mở thư viện paper">☰</button>
  <div class="brand">Paper Assistant<small>hỏi đáp có trích dẫn trên kho paper của bạn</small></div>
  <div class="chips" id="chips"></div>
  <select id="lang" title="Ngôn ngữ trả lời — tách biệt với ngôn ngữ câu hỏi">
    <option value="">Trả lời: theo câu hỏi</option>
    <option value="en">Trả lời: English</option>
    <option value="vi">Trả lời: Tiếng Việt</option>
  </select>
</header>

<div class="app">
  <aside class="side" id="side">
    <h2>Thư viện</h2>
    <div class="search"><input id="filter" placeholder="Lọc paper…" aria-label="Lọc paper"></div>
    <div class="plist" id="plist"></div>
    <div class="controls">
      <div id="scope-note" hidden>
        ◈ Chỉ hỏi trong paper đã chọn <button id="scope-clear">bỏ</button>
      </div>
      <select id="stype" title="Giới hạn loại section">
        <option value="">Mọi section</option>
        <option value="abstract">abstract</option><option value="intro">intro</option>
        <option value="related_work">related_work</option><option value="method">method</option>
        <option value="experiment">experiment</option><option value="result">result</option>
        <option value="conclusion">conclusion</option>
      </select>
      <label><input type="checkbox" id="expand" checked> Query expansion (dịch + mở rộng câu hỏi)</label>
      <button id="cmp-btn" disabled>So sánh các paper đã tick</button>
    </div>
  </aside>

  <main class="chat">
    <div id="conv"><div class="conv-inner" id="conv-inner">
      <div class="empty" id="empty">
        <div class="glyph">¶</div>
        <h3>Hỏi gì cũng được — miễn là có trong kho paper</h3>
        <div>Chọn paper ở thư viện bên trái để khoanh vùng, tick ≥2 paper để so sánh.
             Câu trả lời luôn kèm nguồn.</div>
        <div class="ex" id="examples"></div>
      </div>
    </div></div>
    <div class="composer">
      <div class="composer-inner">
        <textarea id="q" rows="1" placeholder="Hỏi tiếng Việt hoặc tiếng Anh… hỏi tiếp được, app nhớ ngữ cảnh"></textarea>
        <button id="new-conv" title="Xóa ngữ cảnh, bắt đầu hội thoại mới">🗑</button>
        <button id="send">Hỏi</button>
      </div>
      <div class="hint">Enter gửi · Shift+Enter xuống dòng · <span id="status"></span></div>
    </div>
  </main>
</div>

<script>
/* ===== DEMO SHIM — backend giả lập ngay trong trình duyệt =====
   Bản này để bấm thử UX không cần máy chủ: 3 paper mẫu, câu trả lời soạn sẵn,
   streaming mô phỏng. UI + luồng tương tác giống hệt bản thật. */
(() => {
const PAPERS = [
  { paper_id: "2304.03442", year: 2023,
    title: "Generative Agents: Interactive Simulacra of Human Behavior" },
  { paper_id: "2308.11432", year: 2023,
    title: "A Survey on Large Language Model based Autonomous Agents" },
  { paper_id: "local-semg-exo-review", year: 2024,
    title: "sEMG-driven Control of Assistive Exoskeletons: A Review" },
];

const ANSWERS = {
  memory: {
    text: "Generative agents chọn ký ức để retrieve bằng một hàm chấm điểm tổng hợp ba thành phần: recency (độ mới, suy giảm mũ theo thời gian truy cập gần nhất), importance (độ quan trọng do chính language model chấm từ 1-10 khi ký ức được ghi) và relevance (độ tương đồng cosine giữa embedding của ký ức và ngữ cảnh hiện tại). [1] Ba điểm này được chuẩn hóa rồi cộng có trọng số — phiên bản trong paper dùng trọng số bằng nhau — và các ký ức điểm cao nhất được đưa vào prompt. [1] Khảo sát của Wang và cộng sự xếp cơ chế này vào nhóm \"hybrid memory\", kết hợp bộ nhớ ngắn hạn trong context với kho dài hạn truy hồi được, và ghi nhận đây là thiết kế được trích dẫn nhiều nhất trong các agent framework về sau. [2]",
    citations: [
      { n: 1, title: "Generative Agents — 4. Architecture: Memory and Retrieval" },
      { n: 2, title: "A Survey on LLM-based Autonomous Agents — 3.1 Memory" },
    ],
    usage: { input_tokens: 14230, output_tokens: 412, cache_read_input_tokens: 0, cost_usd: 0.0815 },
  },
  limitation: {
    text: "Về hạn chế của cơ chế memory retrieval này, chính các tác giả thừa nhận ba điểm. Thứ nhất, điểm importance do model tự chấm không ổn định — cùng một sự kiện có thể nhận điểm khác nhau giữa các lần chạy. [1] Thứ hai, chi phí tăng tuyến tính theo độ dài memory stream vì mỗi lần retrieve phải chấm lại recency trên toàn bộ ứng viên. [1] Thứ ba, reflection phụ thuộc vào chất lượng câu hỏi tự sinh — nếu model đặt câu hỏi kém, nhận định rút ra sẽ nông. [1] Khảo sát bổ sung rằng hầu hết hệ thống kế thừa kiến trúc này chưa giải quyết được việc quên có chọn lọc (selective forgetting). [2]",
    citations: [
      { n: 1, title: "Generative Agents — 7. Discussion: Limitations" },
      { n: 2, title: "A Survey on LLM-based Autonomous Agents — 6. Challenges" },
    ],
    usage: { input_tokens: 15890, output_tokens: 388, cache_read_input_tokens: 11200, cost_usd: 0.0929 },
  },
  exo: {
    text: "Theo bài review, pipeline điều khiển exoskeleton bằng sEMG gồm bốn tầng: thu tín hiệu bề mặt da (thường 8-16 kênh quanh nhóm cơ chủ vận), tiền xử lý (lọc dải 20-450 Hz, khử nhiễu điện lưới), trích đặc trưng (RMS, MAV, và gần đây là học biểu diễn bằng CNN/TCN), rồi ánh xạ sang lệnh điều khiển — hoặc phân loại rời rạc cử chỉ, hoặc hồi quy liên tục mô-men khớp. [1] Thách thức lớn nhất được nhấn mạnh là electrode shift và mỏi cơ làm phân bố tín hiệu trôi theo thời gian, khiến model huấn luyện một phiên suy giảm mạnh ở phiên sau. [1]",
    citations: [
      { n: 1, title: "sEMG-driven Control of Assistive Exoskeletons — 3. Control Pipeline" },
    ],
    usage: { input_tokens: 9840, output_tokens: 356, cache_read_input_tokens: 0, cost_usd: 0.0581 },
  },
  fallback: {
    text: "Trong kho hiện có 3 paper. Generative Agents đề xuất kiến trúc agent có trí nhớ dài hạn với memory stream, retrieval ba trục và reflection. [1] Bài khảo sát của Wang và cộng sự hệ thống hóa các thành phần của LLM agent — profiling, memory, planning, action — trên hơn 100 công trình. [2] Bài review về exoskeleton tổng hợp pipeline điều khiển bằng tín hiệu sEMG và các thách thức khi triển khai thực tế. [3] Bạn có thể hỏi sâu vào bất kỳ paper nào, hoặc tick 2-3 paper để so sánh.",
    citations: [
      { n: 1, title: "Generative Agents — Abstract" },
      { n: 2, title: "A Survey on LLM-based Autonomous Agents — Abstract" },
      { n: 3, title: "sEMG-driven Control of Assistive Exoskeletons — Abstract" },
    ],
    usage: { input_tokens: 11020, output_tokens: 340, cache_read_input_tokens: 0, cost_usd: 0.0636 },
  },
};

const COMPARE_TEXT = "So sánh cách đánh giá của hai paper:\n\nĐiểm giống — cả hai đều không dùng benchmark định lượng chuẩn: Generative Agents đánh giá bằng phỏng vấn các agent (believability do người chấm), còn bài khảo sát tổng hợp thay vì tự thí nghiệm.\n\nĐiểm khác — Generative Agents thiết kế evaluation riêng gồm 5 nhóm câu hỏi phỏng vấn (self-knowledge, memory, plans, reactions, reflections) và ablation từng thành phần bộ nhớ, cho thấy bỏ retrieval làm believability giảm mạnh nhất. Bài khảo sát tiếp cận theo trục phân loại: gom các phương pháp đánh giá của hơn 100 công trình thành đánh giá chủ quan (human annotation, Turing-style) và khách quan (task success rate, benchmark), đồng thời chỉ ra thiếu chuẩn chung là khoảng trống của cả lĩnh vực.\n\nĐiều kiện áp dụng — cách của Generative Agents phù hợp khi hành vi giống người là mục tiêu chính; khung của bài khảo sát phù hợp làm checklist khi tự thiết kế evaluation cho agent mới.";

function pick(question, history) {
  const q = question.toLowerCase();
  if ((q.includes("hạn chế") || q.includes("limitation") || q.includes("nhược")) && history.length)
    return ANSWERS.limitation;
  if (q.includes("memory") || q.includes("ký ức") || q.includes("nhớ") || q.includes("retriev"))
    return ANSWERS.memory;
  if (q.includes("exo") || q.includes("emg") || q.includes("cơ") || q.includes("khung xương"))
    return ANSWERS.exo;
  return ANSWERS.fallback;
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function sseResponse(answer) {
  const enc = new TextEncoder();
  const words = answer.text.split(" ");
  const stream = new ReadableStream({
    async start(c) {
      const send = obj => c.enqueue(enc.encode("data: " + JSON.stringify(obj) + "\n\n"));
      await sleep(650);                       // mô phỏng retrieval + re-rank
      for (let i = 0; i < words.length; i += 3) {
        send({ type: "delta", text: words.slice(i, i + 3).join(" ") + " " });
        await sleep(38);
      }
      send({ type: "done", ...answer });
      c.close();
    },
  });
  return new Response(stream, { status: 200,
    headers: { "Content-Type": "text/event-stream" } });
}

const json = obj => new Response(JSON.stringify(obj), { status: 200,
  headers: { "Content-Type": "application/json" } });

window.fetch = async (url, opts = {}) => {
  const u = typeof url === "string" ? url : url.url;
  if (u.endsWith("/api/papers")) { await sleep(250); return json(PAPERS); }
  if (u.endsWith("/api/status")) return json({
    llm_backend: "anthropic", answer_model: "claude-opus-5",
    embed_backend: "local (bge-m3)", rerank_backend: "local",
    papers: PAPERS.length, demo: true });
  if (u.endsWith("/api/ask_stream")) {
    const body = JSON.parse(opts.body);
    return sseResponse(pick(body.question, body.history || []));
  }
  if (u.endsWith("/api/compare")) { await sleep(1600); return json({ text: COMPARE_TEXT }); }
  return json({ error: "demo không có endpoint này" });
};
})();
</script>
<script>
const $ = id => document.getElementById(id);
let papers = [], history = [], scopeId = "", compareSet = new Set(), sending = false;

const EXAMPLES = [
  "Generative agents quyết định retrieve ký ức nào như thế nào?",
  "Phương pháp chính của paper này là gì? Tóm tắt 3 ý.",
  "Các paper trong kho khác nhau thế nào về cách đánh giá?",
];

/* ---------------- nạp trạng thái + thư viện ---------------- */
async function loadStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    const chips = [];
    if (s.demo) chips.push(`<span class="chip warn">DEMO — dữ liệu giả</span>`);
    chips.push(`<span class="chip ok">LLM: ${s.answer_model}</span>`);
    chips.push(`<span class="chip optional">embed: ${s.embed_backend}</span>`);
    chips.push(`<span class="chip optional">${s.papers} paper</span>`);
    $("chips").innerHTML = chips.join("");
  } catch { $("chips").innerHTML = `<span class="chip warn">chưa nối được backend</span>`; }
}

async function loadPapers() {
  try { papers = await (await fetch("/api/papers")).json(); }
  catch { papers = []; }
  renderPapers();
  if (!papers.length)
    $("status").textContent = "Kho trống — chạy `python -m src.cli ingest` trước.";
}

function renderPapers() {
  const kw = $("filter").value.trim().toLowerCase();
  $("plist").innerHTML = "";
  for (const p of papers) {
    if (kw && !(`${p.paper_id} ${p.title}`.toLowerCase().includes(kw))) continue;
    const row = document.createElement("div");
    row.className = "paper" + (scopeId === p.paper_id ? " scoped" : "");
    row.title = "Bấm để chỉ hỏi trong paper này · tick để đưa vào so sánh";
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = compareSet.has(p.paper_id);
    cb.setAttribute("aria-label", `Chọn ${p.paper_id} để so sánh`);
    cb.onclick = e => { e.stopPropagation();
      cb.checked ? compareSet.add(p.paper_id) : compareSet.delete(p.paper_id);
      updateCmp(); };
    const txt = document.createElement("div");
    txt.innerHTML = `<div class="t"></div><div class="m"></div>`;
    txt.querySelector(".t").textContent = p.title;
    txt.querySelector(".m").textContent = `${p.paper_id}${p.year ? " · " + p.year : ""}`;
    row.append(cb, txt);
    row.onclick = () => { scopeId = scopeId === p.paper_id ? "" : p.paper_id;
      $("scope-note").hidden = !scopeId; renderPapers(); };
    $("plist").appendChild(row);
  }
}

function updateCmp() {
  const n = compareSet.size;
  $("cmp-btn").disabled = n < 2;
  $("cmp-btn").textContent = n < 2 ? "So sánh các paper đã tick" : `So sánh ${n} paper`;
}

/* ---------------- render hội thoại ---------------- */
function addMsg(cls, text) {
  $("empty")?.remove();
  const wrap = document.createElement("div");
  wrap.className = `msg ${cls}`;
  const b = document.createElement("div");
  b.className = "bubble";
  if (cls === "bot") {
    b.innerHTML = `<div class="answer streaming"></div>`;
    b.querySelector(".answer").textContent = text;
  } else b.textContent = text;
  wrap.appendChild(b);
  $("conv-inner").appendChild(wrap);
  wrap.scrollIntoView({ block: "end" });
  return b;
}

function finishBot(bubble, data) {
  const ans = bubble.querySelector(".answer");
  ans.classList.remove("streaming");
  ans.textContent = data.text;
  if (data.citations?.length) {
    const c = document.createElement("div");
    c.className = "cites";
    c.innerHTML = "<b>Nguồn</b><br>" +
      data.citations.map(x => `[${x.n}] ${x.title}`).join("<br>");
    bubble.appendChild(c);
  }
  if (data.usage) {
    const u = document.createElement("div");
    u.className = "usage";
    let s = `${data.usage.input_tokens.toLocaleString()} in`;
    if (data.usage.cache_read_input_tokens)
      s += ` + ${data.usage.cache_read_input_tokens.toLocaleString()} cache`;
    s += ` / ${data.usage.output_tokens.toLocaleString()} out`;
    if (data.usage.cost_usd != null) s += `  ≈ $${data.usage.cost_usd.toFixed(4)}`;
    u.textContent = s;
    bubble.appendChild(u);
  }
  bubble.scrollIntoView({ block: "end" });
}

function busy(on, note) {
  sending = on;
  $("send").disabled = on;
  $("status").textContent = on ? (note || "đang xử lý…") : "";
}

/* ---------------- hỏi (streaming) ---------------- */
async function ask() {
  const q = $("q").value.trim();
  if (!q || sending) return;
  $("q").value = ""; autosize();
  addMsg("user", q);
  const bubble = addMsg("bot", "");
  busy(true, "đang tìm trong kho + sinh câu trả lời…");
  try {
    const r = await fetch("/api/ask_stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, paper_id: scopeId,
        section_type: $("stype").value, expand: $("expand").checked,
        language: $("lang").value, history }),
    });
    if (!r.ok) throw new Error(await r.text());
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = "", streamed = "";
    const ans = bubble.querySelector(".answer");
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const events = buf.split("\n\n"); buf = events.pop();
      for (const ev of events) {
        if (!ev.startsWith("data: ")) continue;
        const data = JSON.parse(ev.slice(6));
        if (data.type === "delta") { streamed += data.text; ans.textContent = streamed; }
        else if (data.type === "done") {
          finishBot(bubble, data);
          history.push({ question: q, answer: data.text });
        }
      }
    }
  } catch (e) {
    bubble.querySelector(".answer").classList.remove("streaming");
    bubble.querySelector(".answer").innerHTML =
      `<span class="err">Lỗi: ${e.message}</span>`;
  } finally { busy(false); }
}

/* ---------------- so sánh ---------------- */
async function compare() {
  const q = $("q").value.trim();
  if (!q) { $("status").textContent = "Gõ câu hỏi so sánh vào ô bên dưới rồi bấm lại."; return; }
  const ids = [...compareSet];
  $("q").value = ""; autosize();
  addMsg("user", `[So sánh ${ids.join(" · ")}]\n${q}`);
  const bubble = addMsg("bot", "");
  busy(true, "map-reduce từng paper — lâu hơn câu hỏi thường…");
  try {
    const r = await fetch("/api/compare", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, paper_ids: ids, language: $("lang").value }) });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    finishBot(bubble, { text: data.text, citations: [] });
    history.push({ question: q, answer: data.text });
  } catch (e) {
    bubble.querySelector(".answer").classList.remove("streaming");
    bubble.querySelector(".answer").innerHTML = `<span class="err">Lỗi: ${e.message}</span>`;
  } finally { busy(false); }
}

/* ---------------- wiring ---------------- */
function autosize() { const q = $("q");
  q.style.height = "auto"; q.style.height = Math.min(q.scrollHeight, 160) + "px"; }

$("send").onclick = ask;
$("cmp-btn").onclick = compare;
$("new-conv").onclick = () => { history = []; $("conv-inner").innerHTML = "";
  $("status").textContent = "Đã bắt đầu hội thoại mới."; };
$("scope-clear").onclick = () => { scopeId = ""; $("scope-note").hidden = true; renderPapers(); };
$("filter").oninput = renderPapers;
$("menu-btn").onclick = () => $("side").classList.toggle("open");
$("q").addEventListener("input", autosize);
$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
document.querySelector(".chat").addEventListener("click", () =>
  $("side").classList.remove("open"));

EXAMPLES.forEach(x => {
  const b = document.createElement("button");
  b.textContent = x;
  b.onclick = () => { $("q").value = x; autosize(); $("q").focus(); };
  $("examples").appendChild(b);
});

loadStatus(); loadPapers();
</script>
