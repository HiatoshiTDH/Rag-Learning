<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Assistant</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --border:#2a2f3a; --text:#e6e8ee;
          --muted:#8b93a5; --accent:#5aa9ff; --user:#20304a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.6 system-ui, sans-serif; }
  .wrap { max-width:860px; margin:0 auto; padding:24px 16px 60px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:20px; }
  .panel { background:var(--panel); border:1px solid var(--border);
           border-radius:10px; padding:16px; margin-bottom:16px; }
  textarea { width:100%; min-height:70px; resize:vertical; background:var(--bg);
             color:var(--text); border:1px solid var(--border); border-radius:8px;
             padding:10px; font:inherit; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  select, button, label { font:inherit; }
  select { background:var(--bg); color:var(--text); border:1px solid var(--border);
           border-radius:8px; padding:7px 10px; max-width:280px; }
  button { background:var(--accent); color:#08101d; border:0; border-radius:8px;
           padding:8px 18px; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--muted);
                 border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:wait; }
  .muted { color:var(--muted); font-size:13px; }
  .msg { border:1px solid var(--border); border-radius:10px; padding:12px 14px;
         margin-bottom:10px; white-space:pre-wrap; }
  .msg.user { background:var(--user); }
  .msg.bot { background:var(--panel); }
  .cite { border-top:1px solid var(--border); margin-top:10px; padding-top:8px;
          font-size:13px; color:var(--muted); white-space:normal; }
  .cite b { color:var(--text); }
  .usage { margin-top:6px; font-size:12px; color:var(--muted); white-space:normal; }
  .hidden { display:none; }
  .err { color:#ff8080; }
</style>
</head>
<body>
<div class="wrap">
  <h1>📄 Paper Assistant</h1>
  <div class="sub">Hỏi đáp trên kho paper đã index — hội thoại nhớ ngữ cảnh, trả lời streaming</div>

  <div id="conv"></div>

  <div class="panel">
    <textarea id="q" placeholder="Hỏi bằng tiếng Việt hoặc tiếng Anh… hỏi tiếp được ('còn về X thì sao?'). Ctrl+Enter để gửi"></textarea>
    <div class="row">
      <select id="paper"><option value="">— Toàn bộ kho —</option></select>
      <select id="stype">
        <option value="">— Mọi section —</option>
        <option>abstract</option><option>intro</option><option>related_work</option>
        <option>method</option><option>experiment</option><option>result</option>
        <option>conclusion</option>
      </select>
      <label class="muted"><input type="checkbox" id="expand" checked> query expansion</label>
      <select id="lang" title="Ngôn ngữ TRẢ LỜI — tách biệt với ngôn ngữ câu hỏi">
        <option value="">Trả lời: theo câu hỏi</option>
        <option value="en">Trả lời: English</option>
        <option value="vi">Trả lời: Tiếng Việt</option>
      </select>
      <button id="ask">Hỏi</button>
      <button id="cmp" class="ghost" title="Chọn nhiều paper bằng Ctrl+click ở ô bên dưới">So sánh</button>
      <button id="reset" class="ghost" title="Xóa ngữ cảnh hội thoại">🗑 Mới</button>
    </div>
    <div class="row">
      <select id="papers-multi" multiple size="3" class="hidden" style="min-width:280px"></select>
    </div>
  </div>

  <div class="muted" id="status"></div>
</div>

<script>
const $ = id => document.getElementById(id);
let history = [];   // [{question, answer}] — gửi kèm mỗi request để có hội thoại nhiều lượt

async function loadPapers() {
  const papers = await (await fetch("/api/papers")).json();
  for (const sel of [$("paper"), $("papers-multi")]) {
    for (const p of papers) {
      const o = document.createElement("option");
      o.value = p.paper_id;
      o.textContent = `${p.paper_id} — ${p.title.slice(0, 60)}`;
      sel.appendChild(o);
    }
  }
  if (!papers.length)
    $("status").textContent = "Kho trống — chạy `python -m src.cli ingest` trước.";
}

function busy(on) {
  $("ask").disabled = $("cmp").disabled = on;
  $("status").textContent = on ? "Đang xử lý…" : "";
}

function addMsg(cls, text) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.textContent = text;
  $("conv").appendChild(div);
  div.scrollIntoView({ behavior: "smooth", block: "end" });
  return div;
}

function finishBot(div, data) {
  div.textContent = data.text;
  if (data.citations && data.citations.length) {
    const c = document.createElement("div");
    c.className = "cite";
    c.innerHTML = "<b>Nguồn</b><br>" + data.citations.map(x => `[${x.n}] ${x.title}`).join("<br>");
    div.appendChild(c);
  }
  if (data.usage) {
    const u = document.createElement("div");
    u.className = "usage";
    let s = `${data.usage.input_tokens.toLocaleString()} in`;
    if (data.usage.cache_read_input_tokens) s += ` + ${data.usage.cache_read_input_tokens.toLocaleString()} cache`;
    s += ` / ${data.usage.output_tokens.toLocaleString()} out`;
    if (data.usage.cost_usd != null) s += ` ≈ $${data.usage.cost_usd.toFixed(4)}`;
    u.textContent = s;
    div.appendChild(u);
  }
  div.scrollIntoView({ behavior: "smooth", block: "end" });
}

$("ask").onclick = async () => {
  const q = $("q").value.trim();
  if (!q) return;
  $("q").value = "";
  addMsg("user", q);
  const bot = addMsg("bot", "…");
  busy(true);
  try {
    const r = await fetch("/api/ask_stream", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, paper_id: $("paper").value,
        section_type: $("stype").value, expand: $("expand").checked,
        language: $("lang").value, history }),
    });
    if (!r.ok) throw new Error(await r.text());
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "", streamed = "";
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const events = buffer.split("\n\n");
      buffer = events.pop();               // giữ phần chưa trọn vẹn
      for (const ev of events) {
        if (!ev.startsWith("data: ")) continue;
        const data = JSON.parse(ev.slice(6));
        if (data.type === "delta") {
          streamed += data.text;
          bot.textContent = streamed;      // chữ chạy dần
        } else if (data.type === "done") {
          finishBot(bot, data);            // thay bằng bản chốt có [n] + nguồn + chi phí
          history.push({ question: q, answer: data.text });
        }
      }
    }
  } catch (e) {
    bot.innerHTML = `<span class="err">Lỗi: ${e.message}</span>`;
  } finally { busy(false); }
};

$("cmp").onclick = async () => {
  const multi = $("papers-multi");
  if (multi.classList.contains("hidden")) {           // lần bấm đầu: hiện ô chọn
    multi.classList.remove("hidden");
    $("status").textContent = "Chọn ≥2 paper (Ctrl+click) rồi bấm So sánh lần nữa.";
    return;
  }
  const ids = [...multi.selectedOptions].map(o => o.value);
  const q = $("q").value.trim();
  if (!q || ids.length < 2) { $("status").textContent = "Cần câu hỏi + ≥2 paper."; return; }
  $("q").value = "";
  addMsg("user", `[So sánh ${ids.join(" vs ")}] ${q}`);
  const bot = addMsg("bot", "Đang so sánh… (map-reduce, có thể lâu hơn câu hỏi thường)");
  busy(true);
  try {
    const r = await fetch("/api/compare", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, paper_ids: ids, language: $("lang").value }) });
    if (!r.ok) throw new Error(await r.text());
    const data = await r.json();
    finishBot(bot, { text: data.text, citations: [] });
    history.push({ question: q, answer: data.text });
  } catch (e) {
    bot.innerHTML = `<span class="err">Lỗi: ${e.message}</span>`;
  } finally { busy(false); }
};

$("reset").onclick = () => {
  history = [];
  $("conv").innerHTML = "";
  $("status").textContent = "Đã bắt đầu hội thoại mới.";
};

$("q").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("ask").click();
});

loadPapers();
</script>
</body>
</html>
